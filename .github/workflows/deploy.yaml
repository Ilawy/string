name: Deploy to Surge

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Project
        run: npm run build

      - name: Configure Surge Files
        run: |
          echo "string.osad.net" > ./dist/CNAME
          cp ./dist/index.html ./dist/200.html 

      - name: Deploy to Surge
        run: |
          npm install -g surge
          surge ./dist --token ${{ secrets.SURGE_TOKEN }}
